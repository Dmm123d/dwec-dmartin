<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscripción · David Martín Martí</title>

  <!-- CSS de Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Iconos de Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- JavaScript con defer -->
  <script src="js/app.js" defer></script>
</head>
<body>

  <!--
    PLANTILLA DE LA TAREA 8
    · Esta vez el formulario lo maquetas tú: aquí solo tienes el primer campo, «nombre», como modelo.
    · Todos los campos siguen el mismo esquema:
        <div class="mb-3">                                  ← un div por campo
          <label for="ID" class="form-label">…</label>      ← for = el id del campo
          <input … id="ID" name="NOMBRE" class="form-control">
          <div class="invalid-feedback"></div>              ← aquí escribirá app.js el error
        </div>
    · Los id que usa el JavaScript están en el enunciado: respétalos.
    · Todo lo que va entre [corchetes] es un hueco: sustitúyelo por lo tuyo.
  -->

  <!-- NAVBAR -->
  <nav class="navbar bg-primary" data-bs-theme="dark">
    <div class="container">
      <span class="navbar-brand"><i class="bi bi-person-circle"></i> David Martín Martí</span>
      <span class="navbar-text">Tarea 8 · DWEC</span>
    </div>
  </nav>

  <!-- CABECERA -->
  <header class="bg-body-tertiary border-bottom py-4 mb-4">
    <div class="container">
      <h1 class="h2 mb-1">Jornadas de Desarrollo Web 2026</h1>
      <p class="lead mb-0 text-body-secondary">Formulario de inscripción. Los campos con * son obligatorios.</p>
    </div>
  </header>

  <main class="container mb-5">
    <div class="row g-4">

      <!-- EL FORMULARIO -->
      <div class="col-12 col-lg-7">
        <section class="card shadow-sm">
          <div class="card-body">
            <form id="inscripcion" action="recibido.html" method="get">

              <fieldset class="mb-4">
                <legend class="fs-5 border-bottom pb-1">Tus datos</legend>

                <!-- Nombre y Apellidos -->
                <div class="mb-3">
                  <label for="nombre" class="form-label">Nombre y apellidos *</label>
                  <input type="text" id="nombre" name="nombre" class="form-control" autocomplete="name"
                         required minlength="3" maxlength="60" pattern="[A-Za-zÁÉÍÓÚÜáéíóúüÑñ\- ]+"
                         title="Solo letras, espacios y guiones.">
                  <div class="invalid-feedback"></div>
                </div>

                <!-- Correo electrónico -->
                <div class="mb-3">
                  <label for="email" class="form-label">Correo electrónico *</label>
                  <input type="email" id="email" name="email" class="form-control" autocomplete="email"
                         required>
                  <div class="invalid-feedback"></div>
                </div>

                <!-- Repite el correo -->
                <div class="mb-3">
                  <label for="email2" class="form-label">Repite el correo *</label>
                  <input type="email" id="email2" class="form-control" autocomplete="email"
                         required>
                  <div class="invalid-feedback"></div>
                </div>

                <!-- Teléfono -->
                <div class="mb-3">
                  <label for="telefono" class="form-label">Teléfono</label>
                  <input type="tel" id="telefono" name="telefono" class="form-control" autocomplete="tel"
                         pattern="^\d{9}$" required>
                  <div class="invalid-feedback"></div>
                </div>

                <!-- Fecha de Nacimiento -->
                <div class="mb-3">
                  <label for="nacimiento" class="form-label">Fecha de Nacimiento *</label>
                  <input type="date" id="nacimiento" name="nacimiento" class="form-control" autocomplete="bday"
                         min="1940-01-01" max="2010-12-31" required>
                  <div class="invalid-feedback"></div>
                </div>

                <!-- TODO: correo (email), «Repite el correo» (email2, SIN name), teléfono (telefono)
                           y fecha de nacimiento (nacimiento). Dos por fila con la rejilla de Bootstrap. -->

              </fieldset>

              <fieldset class="mb-4">
                <legend class="fs-5 border-bottom pb-1">Tu inscripción</legend>

                <!-- Modalidad -->
                <div class="mb-3">
                  <label for="modalidad" class="form-label">Modalidad</label>
                  <input type="select" id="modalidad" name="modalidad" class="form-control" required>
                  <div class="invalid-feedback"></div>
                </div>

                <!-- Taller de la tarde -->
                <div class="mb-3">
                  <p class="form-label">Taller de la tarde *</p>

                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="taller" id="html" value="html_accesible" required>
                    <label class="form-check-label" for="html">
                      HTML accesible
                    </label>
                  </div>

                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="taller" id="js" value="javascript_moderno" required>
                    <label class="form-check-label" for="js">
                      JavaScript moderno
                    </label>
                  </div>

                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="taller" id="bootstrap" value="bootstrap_a_fondo" required>
                    <label class="form-check-label" for="bootstrap">
                      Bootstrap a fondo
                    </label>
                  </div>


                </div>

              </fieldset>

              <!-- TODO: un segundo <fieldset> «Tu inscripción» con la modalidad (select), el taller (tres radio
                         con el mismo name), el nivel de JavaScript (range con su <output>), los comentarios
                         (textarea con su contador) y la casilla de las condiciones. -->

              <!-- TODO: los botones «Enviar inscripción» (submit) y «Borrar» (reset). -->

            </form>
          </div>
        </section>
      </div>

      <!-- TODO (ejercicio 6): una tarjeta «Resumen antes de enviar» con el botón #verResumen,
                                el párrafo #avisoResumen y la lista #resumen. -->

    </div>
  </main>

  <footer class="bg-body-tertiary border-top py-3">
    <div class="container small text-body-secondary">
      David Martín Martí · DWEC 26/27 · Tarea 8 · Las capturas, la reflexión y las fuentes están en el README.
    </div>
  </footer>

  <!-- JS de Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
